name: Gerar APK Auth Sensi

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          mkdir extracted
          unzip AuthSensi-Android-Project.zip -d extracted
          sed -i '/isExternalStorageManagerCompat/d' extracted/AuthSensi/app/src/main/java/com/authsensi/app/CacheCleaner.kt

      - name: Compilar APK
        run: gradle -p extracted/AuthSensi assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Auth-Sensi-APK
          path: extracted/AuthSensi/app/build/outputs/apk/debug/app-debug.apk
